apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud
spec:
  selector:
    matchLabels:
      app: nextcloud
  replicas: 1
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: nextcloud
    spec:
      containers:
      - name: nextcloud
        # Pin to a major tag so a pod restart can't silently pull a new major.
        image: nextcloud:30-apache
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
            ephemeral-storage: "256Mi"
          # Limits so a leak or spike can't starve the node.
          limits:
            memory: "1Gi"
            cpu: "1"
            ephemeral-storage: "1Gi"
        env:
          - name: TZ
            value: "${TIMEZONE}"
        ports:
        - containerPort: 80
        # Probes so Kubernetes can tell a wedged pod from a healthy one and
        # hold traffic until it's actually up. Liveness is a cheap "is the port
        # open" check; readiness confirms the app is actually serving. Nextcloud
        # is slow to boot, hence the generous initial delays.
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 6
        readinessProbe:
          httpGet:
            path: /status.php
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        volumeMounts:
        - mountPath: /var/www/html
          name: nextcloud-html
        - mountPath: /var/www/html/custom_apps
          name: nextcloud-custom-apps
        - mountPath: var/www/html/config
          name: nextcloud-config
        - mountPath: /var/www/html/data
          name: nextcloud-data
        - mountPath: /var/www/html/themes/
          name: nextcloud-themes
      volumes:
      - name: nextcloud-html
        persistentVolumeClaim:
          claimName:  nextcloud-html-claim
      - name: nextcloud-custom-apps
        persistentVolumeClaim:
          claimName:  nextcloud-custom-apps-claim
      - name: nextcloud-config
        persistentVolumeClaim:
          claimName:  nextcloud-config-claim
      - name: nextcloud-data
        persistentVolumeClaim:
          claimName:  nextcloud-data-claim
      - name: nextcloud-themes
        persistentVolumeClaim:
          claimName:  nextcloud-themes-claim
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
