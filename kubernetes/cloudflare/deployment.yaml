apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare
spec:
  selector:
    matchLabels:
      app: cloudflare
  replicas: 1
  template:
    metadata:
      labels:
        app: cloudflare
    spec:
      containers:
      - name: cloudflare
        image: oznu/cloudflare-ddns
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        env:
          # The API key comes from a Secret, not an inline value. A plaintext
          # credential here lands in git history and is visible to anyone who
          # can `kubectl describe pod`. Create the secret out-of-band:
          #   kubectl create secret generic cloudflare-ddns \
          #     --from-literal=api-key=<your-cloudflare-api-key>
          # (see secret.example.yaml)
          - name: API_KEY
            valueFrom:
              secretKeyRef:
                name: cloudflare-ddns
                key: api-key
          - name: DNS_SERVER
            value: 1.1.1.1
          - name: PROXIED
            value: "true"
          - name: ZONE
            value: example.com
